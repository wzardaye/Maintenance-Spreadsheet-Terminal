<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Drive - Workplace</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Background image setup */
        .bg-custom {
            background-image: url('https://images.unsplash.com/photo-1557683316-973673baf926?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* Glassmorphism utility */
        .glass-panel {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body class="bg-custom min-h-screen relative text-gray-800">
    
    <!-- Global Blur Overlay (creates the blurred background effect) -->
    <div class="absolute inset-0 bg-white/40 backdrop-blur-sm fixed pointer-events-none"></div>

    <!-- Hovering Header -->
    <header class="fixed top-0 left-0 right-0 z-50 glass-panel shadow-sm">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-center">
            <!-- Logo area (No buttons) -->
            <div class="flex items-center gap-3">
                <i data-lucide="briefcase" class="w-8 h-8 text-blue-800"></i>
                <span class="text-2xl font-bold text-gray-900 tracking-tight">WorkplaceHub</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="relative z-10 pt-32 pb-20 px-6 max-w-5xl mx-auto flex flex-col items-center justify-center min-h-[calc(100vh-80px)]">
        
        <div class="text-center mb-12">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-900 mb-4">Akses Cepat Dokumen</h1>
            <p class="text-gray-700">Pilih direktori Google Drive yang ingin Anda tuju.</p>
        </div>

        <!-- 6 Buttons Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 w-full">
            
            <!-- Button 1 -->
            <a href="LINK_DRIVE_ANDA_DI_SINI" target="_blank" class="glass-panel rounded-2xl p-8 flex flex-col items-center justify-center gap-5 hover:-translate-y-1 hover:bg-white/60 transition-all duration-300 shadow-md hover:shadow-xl group">
                <div class="p-4 bg-green-400/20 rounded-full group-hover:bg-green-400/30 group-hover:scale-110 transition-all">
                    <i data-lucide="folder-kanban" class="w-10 h-10 text-green-500"></i>
                </div>
                <span class="font-semibold text-lg text-gray-900">PM</span>
            </a>

            <!-- Button 2 -->
            <a href="LINK_DRIVE_ANDA_DI_SINI" target="_blank" class="glass-panel rounded-2xl p-8 flex flex-col items-center justify-center gap-5 hover:-translate-y-1 hover:bg-white/60 transition-all duration-300 shadow-md hover:shadow-xl group">
                <div class="p-4 bg-sky-400/20 rounded-full group-hover:bg-sky-400/30 group-hover:scale-110 transition-all">
                    <i data-lucide="folder-search" class="w-10 h-10 text-sky-500"></i>
                </div>
                <span class="font-semibold text-lg text-gray-900">CM</span>
            </a>

            <!-- Button 3 -->
            <a href="LINK_DRIVE_ANDA_DI_SINI" target="_blank" class="glass-panel rounded-2xl p-8 flex flex-col items-center justify-center gap-5 hover:-translate-y-1 hover:bg-white/60 transition-all duration-300 shadow-md hover:shadow-xl group">
                <div class="p-4 bg-red-500/10 rounded-full group-hover:bg-red-500/20 group-hover:scale-110 transition-all">
                    <i data-lucide="folder-check" class="w-10 h-10 text-red-600"></i>
                </div>
                <span class="font-semibold text-lg text-gray-900">BM</span>
            </a>

            <!-- Button 4 -->
            <a href="LINK_DRIVE_ANDA_DI_SINI" target="_blank" class="glass-panel rounded-2xl p-8 flex flex-col items-center justify-center gap-5 hover:-translate-y-1 hover:bg-white/60 transition-all duration-300 shadow-md hover:shadow-xl group">
                <div class="p-4 bg-yellow-400/20 rounded-full group-hover:bg-yellow-400/30 group-hover:scale-110 transition-all">
                    <i data-lucide="folder-sync" class="w-10 h-10 text-yellow-600"></i>
                </div>
                <span class="font-semibold text-lg text-gray-900">YOKOTEN</span>
            </a>

            <!-- Button 5 -->
            <a href="LINK_DRIVE_ANDA_DI_SINI" target="_blank" class="glass-panel rounded-2xl p-8 flex flex-col items-center justify-center gap-5 hover:-translate-y-1 hover:bg-white/60 transition-all duration-300 shadow-md hover:shadow-xl group">
                <div class="p-4 bg-rose-600/10 rounded-full group-hover:bg-rose-600/20 group-hover:scale-110 transition-all">
                    <i data-lucide="folder-archive" class="w-10 h-10 text-rose-700"></i>
                </div>
                <span class="font-semibold text-lg text-gray-900">Arsip Tahun Lalu</span>
            </a>

            <!-- Button 6 -->
            <a href="LINK_DRIVE_ANDA_DI_SINI" target="_blank" class="glass-panel rounded-2xl p-8 flex flex-col items-center justify-center gap-5 hover:-translate-y-1 hover:bg-white/60 transition-all duration-300 shadow-md hover:shadow-xl group">
                <div class="p-4 bg-indigo-600/10 rounded-full group-hover:bg-indigo-600/20 group-hover:scale-110 transition-all">
                    <i data-lucide="settings" class="w-10 h-10 text-indigo-700"></i>
                </div>
                <span class="font-semibold text-lg text-gray-900">Admin Page</span>
            </a>

        </div>
    </main>

    <!-- Confirmation Modal Overlay -->
    <div id="confirmationModal" class="fixed inset-0 z-[100] hidden flex items-center justify-center bg-gray-900/40 backdrop-blur-md transition-opacity duration-300 opacity-0">
        <div class="bg-white/90 backdrop-blur-lg border border-white/50 p-8 rounded-2xl shadow-2xl max-w-md w-full mx-4 transform scale-95 transition-transform duration-300" id="modalContent">
            <div class="text-center">
                <div class="mx-auto flex items-center justify-center h-14 w-14 rounded-full bg-blue-100 mb-5 shadow-inner">
                    <i data-lucide="external-link" class="h-7 w-7 text-blue-600"></i>
                </div>
                <h3 class="text-2xl font-bold text-gray-900 mb-2">Konfirmasi Tautan</h3>
                <p class="text-gray-600 text-md mb-4">Anda akan masuk ke link berikut ini:</p>
                
                <!-- Display Link Area -->
                <div class="bg-gray-100/80 p-4 rounded-xl mb-8 break-all border border-gray-200 shadow-sm">
                    <p id="modalLinkText" class="text-sm font-mono text-blue-700 font-medium select-all"></p>
                </div>
                
                <!-- Action Buttons -->
                <div class="flex justify-center gap-4">
                    <button id="btnDecline" class="flex-1 px-5 py-3 bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold rounded-xl transition-all duration-200">
                        Batal
                    </button>
                    <button id="btnConfirm" class="flex-1 px-5 py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl transition-all duration-200 shadow-lg shadow-blue-600/30 hover:shadow-blue-600/50 hover:-translate-y-0.5">
                        Lanjutkan
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Script to render icons and handle modal logic -->
    <script>
        // Render Lucide Icons
        lucide.createIcons();

        // Modal Elements
        const modal = document.getElementById('confirmationModal');
        const modalContent = document.getElementById('modalContent');
        const modalLinkText = document.getElementById('modalLinkText');
        const btnDecline = document.getElementById('btnDecline');
        const btnConfirm = document.getElementById('btnConfirm');
        
        let pendingUrl = '';

        // Select all the drive links in the main grid
        const driveLinks = document.querySelectorAll('main .grid a');

        // Add click event to all 6 buttons
        driveLinks.forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault(); // Prevent default direct navigation
                pendingUrl = this.href;
                modalLinkText.textContent = pendingUrl;
                
                // Show modal with smooth transition
                modal.classList.remove('hidden');
                // Small delay to allow display change before applying opacity transition
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    modalContent.classList.remove('scale-95');
                    modalContent.classList.add('scale-100');
                }, 10);
            });
        });

        // Function to close modal
        function closeModal() {
            modal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            
            // Wait for transition to finish before hiding
            setTimeout(() => {
                modal.classList.add('hidden');
                pendingUrl = '';
            }, 300); 
        }

        // Decline Button Action
        btnDecline.addEventListener('click', closeModal);

        // Close when clicking outside the modal box
        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                closeModal();
            }
        });

        // Confirm Button Action
        btnConfirm.addEventListener('click', function() {
            if (pendingUrl) {
                window.open(pendingUrl, '_blank'); // Open Drive link in new tab
                closeModal(); // Close the modal
            }
        });
    </script>
</body>
</html>
