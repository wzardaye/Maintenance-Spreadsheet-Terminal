<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Drive - Workplace</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Background image setup */
        .bg-custom {
            background-image: url('https://images.unsplash.com/photo-1557683316-973673baf926?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* Glassmorphism utility */
        .glass-panel {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body class="bg-custom min-h-screen relative text-gray-800">
    
    <!-- Global Blur Overlay (creates the blurred background effect) -->
    <div class="absolute inset-0 bg-white/40 backdrop-blur-sm fixed pointer-events-none"></div>

    <!-- Hovering Header -->
    <header class="fixed top-0 left-0 right-0 z-50 glass-panel shadow-sm">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-center">
            <!-- Logo area (No buttons) -->
            <div class="flex items-center gap-3">
                <i data-lucide="briefcase" class="w-8 h-8 text-blue-800"></i>
                <span class="text-2xl font-bold text-gray-900 tracking-tight">WorkplaceHub</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="relative z-10 pt-32 pb-20 px-6 max-w-5xl mx-auto flex flex-col items-center justify-center min-h-[calc(100vh-80px)]">
        
        <div class="text-center mb-12">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-900 mb-4">Akses Cepat Dokumen</h1>
            <p class="text-gray-700">Pilih direktori Google Drive yang ingin Anda tuju.</p>
        </div>

        <!-- 6 Buttons Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 w-full">
            
            <!-- Button 1 -->
            <a href="LINK_DRIVE_ANDA_DI_SINI" target="_blank" class="glass-panel rounded-2xl p-8 flex flex-col items-center justify-center gap-5 hover:-translate-y-1 hover:bg-white/60 transition-all duration-300 shadow-md hover:shadow-xl group">
                <div class="p-4 bg-green-400/20 rounded-full group-hover:bg-green-400/30 group-hover:scale-110 transition-all">
                    <i data-lucide="folder-kanban" class="w-10 h-10 text-green-500"></i>
                </div>
                <span class="font-semibold text-lg text-gray-900">PM</span>
            </a>

            <!-- Button 2 -->
            <a href="LINK_DRIVE_ANDA_DI_SINI" target="_blank" class="glass-panel rounded-2xl p-8 flex flex-col items-center justify-center gap-5 hover:-translate-y-1 hover:bg-white/60 transition-all duration-300 shadow-md hover:shadow-xl group">
                <div class="p-4 bg-sky-400/20 rounded-full group-hover:bg-sky-400/30 group-hover:scale-110 transition-all">
                    <i data-lucide="folder-search" class="w-10 h-10 text-sky-500"></i>
                </div>
                <span class="font-semibold text-lg text-gray-900">CM</span>
            </a>

            <!-- Button 3 -->
            <a href="LINK_DRIVE_ANDA_DI_SINI" target="_blank" class="glass-panel rounded-2xl p-8 flex flex-col items-center justify-center gap-5 hover:-translate-y-1 hover:bg-white/60 transition-all duration-300 shadow-md hover:shadow-xl group">
                <div class="p-4 bg-red-500/10 rounded-full group-hover:bg-red-500/20 group-hover:scale-110 transition-all">
                    <i data-lucide="folder-check" class="w-10 h-10 text-red-600"></i>
                </div>
                <span class="font-semibold text-lg text-gray-900">BM</span>
            </a>

            <!-- Button 4 -->
            <a href="LINK_DRIVE_ANDA_DI_SINI" target="_blank" class="glass-panel rounded-2xl p-8 flex flex-col items-center justify-center gap-5 hover:-translate-y-1 hover:bg-white/60 transition-all duration-300 shadow-md hover:shadow-xl group">
                <div class="p-4 bg-yellow-400/20 rounded-full group-hover:bg-yellow-400/30 group-hover:scale-110 transition-all">
                    <i data-lucide="folder-sync" class="w-10 h-10 text-yellow-600"></i>
                </div>
                <span class="font-semibold text-lg text-gray-900">YOKOTEN</span>
            </a>

            <!-- Button 5 -->
            <a href="LINK_DRIVE_ANDA_DI_SINI" target="_blank" class="glass-panel rounded-2xl p-8 flex flex-col items-center justify-center gap-5 hover:-translate-y-1 hover:bg-white/60 transition-all duration-300 shadow-md hover:shadow-xl group">
                <div class="p-4 bg-rose-600/10 rounded-full group-hover:bg-rose-600/20 group-hover:scale-110 transition-all">
                    <i data-lucide="folder-archive" class="w-10 h-10 text-rose-700"></i>
                </div>
                <span class="font-semibold text-lg text-gray-900">Arsip Tahun Lalu</span>
            </a>

            <!-- Button 6 -->
            <a href="LINK_DRIVE_ANDA_DI_SINI" target="_blank" class="glass-panel rounded-2xl p-8 flex flex-col items-center justify-center gap-5 hover:-translate-y-1 hover:bg-white/60 transition-all duration-300 shadow-md hover:shadow-xl group">
                <div class="p-4 bg-indigo-600/10 rounded-full group-hover:bg-indigo-600/20 group-hover:scale-110 transition-all">
                    <i data-lucide="settings" class="w-10 h-10 text-indigo-700"></i>
                </div>
                <span class="font-semibold text-lg text-gray-900">Admin Page</span>
            </a>

        </div>
    </main>

    <!-- Script to render icons -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
